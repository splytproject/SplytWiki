---
title: Search results
display_title: Search results
tab: Special page
permalink: /search/
sitemap: false
---
<div class="searchresults">
  <form class="search-form" action="{{ '/search/' | relative_url }}" role="search">
    <input type="search" name="search" placeholder="Search {{ site.title }}" aria-label="Search {{ site.title }}" autofocus>
    <button type="submit">Search</button>
  </form>
  <div id="splyt-search-results">
    <p class="search-info">Type a word or phrase above to search all {{ site.wiki | size }} articles.</p>
  </div>
  <noscript><p>Search needs JavaScript. You can browse the <a href="{{ '/contents/' | relative_url }}">list of all articles</a> instead.</p></noscript>
</div>
