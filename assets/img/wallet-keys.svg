<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How a wallet derives an address from a private key</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#54595d"/>
    </marker>
  </defs>
  <rect width="640" height="210" fill="#fff"/>

  <g transform="translate(16 40)">
    <rect width="168" height="96" rx="4" fill="#fdecea" stroke="#d73333"/>
    <text x="84" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202122">Private key</text>
    <text x="84" y="50" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#202122">e9873d79c6d87dc0…</text>
    <text x="84" y="74" text-anchor="middle" font-size="11" fill="#b32424">Secret – never share</text>
  </g>

  <g transform="translate(236 40)">
    <rect width="168" height="96" rx="4" fill="#f8f9fa" stroke="#a2a9b1"/>
    <text x="84" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202122">Public key</text>
    <text x="84" y="50" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#202122">02a1633cafcc01eb…</text>
    <text x="84" y="74" text-anchor="middle" font-size="11" fill="#54595d">Can be shared</text>
  </g>

  <g transform="translate(456 40)">
    <rect width="168" height="96" rx="4" fill="#eaf3ff" stroke="#36c"/>
    <text x="84" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#202122">Address</text>
    <text x="84" y="50" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#202122">bc1qar0srrr7xf…</text>
    <text x="84" y="74" text-anchor="middle" font-size="11" fill="#54595d">Give this out to get paid</text>
  </g>

  <line x1="188" y1="88" x2="230" y2="88" stroke="#54595d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="408" y1="88" x2="450" y2="88" stroke="#54595d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="160" text-anchor="middle" font-size="11" fill="#54595d">elliptic-curve</text>
  <text x="210" y="174" text-anchor="middle" font-size="11" fill="#54595d">multiplication</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#54595d">hashing +</text>
  <text x="430" y="174" text-anchor="middle" font-size="11" fill="#54595d">encoding</text>

  <text x="320" y="22" text-anchor="middle" font-size="12" fill="#202122">Each step is easy to compute forwards but practically impossible to reverse.</text>
  <text x="320" y="200" text-anchor="middle" font-size="10.5" fill="#72777d">Values shown are shortened examples.</text>
</svg>
