<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.is_main %}
<title>{{ site.title }}, the free crypto encyclopedia</title>
{%- else %}
<title>{{ page.title }} - {{ site.title }}</title>
{%- endif %}
{% seo title=false %}
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{ '/assets/img/logo.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/splytwiki.css' | relative_url }}">
<script>
/* Apply saved appearance settings before the page paints. */
(function () {
  var r = document.documentElement;
  r.className = r.className.replace('client-nojs', 'client-js');
  try {
    var p = JSON.parse(localStorage.getItem('splyt-prefs')) || {};
    if (p.size) r.className = r.className.replace('splyt-size-standard', 'splyt-size-' + p.size);
    if (p.width === 'wide') r.className += ' splyt-width-wide';
    if (p.theme === 'light' || p.theme === 'dark') r.setAttribute('data-theme', p.theme);
  } catch (e) {}
})();
</script>
