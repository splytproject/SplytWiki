{%- include i18n.html -%}
<header class="vector-header" role="banner">
  <div class="vector-header-start">
    <details class="splyt-dropdown vector-main-menu-dropdown">
      <summary class="icon-button" title="Main menu" aria-label="Main menu">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1 3v2h18V3zm0 8h18V9H1zm0 6h18v-2H1z"/></svg>
      </summary>
      <div class="dropdown-panel">
        {% include main-menu.html %}
      </div>
    </details>
    <a href="{{ '/' | relative_url }}" class="mw-logo" title="Visit the main page">
      <img class="mw-logo-icon" src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="50" height="50">
      <span class="mw-logo-container">
        <span class="mw-logo-wordmark">{{ site.title }}</span>
        <span class="mw-logo-tagline">{{ site.tagline }}</span>
      </span>
    </a>
  </div>

  <div class="vector-header-end">
    <form class="search-box" action="{{ '/search/' | relative_url }}" role="search" autocomplete="off">
      <div class="search-input">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.2 13.6a7 7 0 1 1 1.4-1.4l5.4 5.4-1.4 1.4zM3 8a5 5 0 1 0 10 0A5 5 0 0 0 3 8"/></svg>
        <input type="search" name="search" placeholder="Search {{ site.title }}" aria-label="Search {{ site.title }}" spellcheck="false">
        <div class="search-suggestions" role="listbox" hidden></div>
      </div>
      <button type="submit" class="search-button">Search</button>
    </form>

    <button type="button" class="icon-button search-toggle" title="Search" aria-label="Search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.2 13.6a7 7 0 1 1 1.4-1.4l5.4 5.4-1.4 1.4zM3 8a5 5 0 1 0 10 0A5 5 0 0 0 3 8"/></svg>
    </button>
    <button type="button" class="icon-button appearance-toggle" title="Appearance" aria-label="Appearance">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 16V3a7 7 0 0 1 0 14"/></svg>
    </button>
    {% include lang-switcher.html %}
    <nav class="vector-user-links" aria-label="Personal tools">
      <a href="{{ t.prefix | append: '/contribute/' | relative_url }}">{{ t.contribute }}</a>
    </nav>
  </div>
</header>
