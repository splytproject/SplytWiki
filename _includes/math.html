{%- comment -%}
  KaTeX, loaded only on pages with `math: true` in front matter (see docs/COMPONENTS.md).
  kramdown turns $$…$$ into \(…\) inside a paragraph and \[…\] on its own line;
  auto-render also accepts plain $…$ for simple inline maths.
{%- endcomment -%}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="renderMathInElement(document.querySelector('.mw-parser-output') || document.body, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false },
      { left: '$', right: '$', display: false }
    ],
    ignoredClasses: ['highlighter-rouge', 'source-header', 'no-math'],
    throwOnError: false
  });"></script>
