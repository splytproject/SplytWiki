# ------------------------------------------------------------------
#  "On this day" events for the Main Page.
#  date: "MM-DD" (keep the quotes), year: YYYY, text: Markdown.
#  Links are relative to the Main Page: [text](wiki/Article_Name/)
#  Visitors see today's events; if there are none, they see this month's.
