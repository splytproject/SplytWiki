# "Today's featured picture"
picture:
  image: blockchain-diagram.svg
  page: Blockchain
  title: Structure of a blockchain
  caption: "A simplified diagram of a [blockchain](wiki/Blockchain/). Each block stores a batch of transactions together with the cryptographic hash of the block before it. Changing any past transaction would change that block's hash and break every link after it, which is what makes the ledger tamper-evident."
