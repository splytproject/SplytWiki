# "Did you know ..." (each item starts after the "...")
did_you_know:
  - "that the first known purchase of goods with [bitcoin](wiki/Bitcoin/) was two pizzas, bought for 10,000 BTC in May 2010?"
  - "that the very first block of the [Bitcoin](wiki/Bitcoin/) [blockchain](wiki/Blockchain/) contains a headline from *The Times*: \"Chancellor on brink of second bailout for banks\"?"
  - "that the smallest unit of [ether](wiki/Ethereum/), the wei, is named after the computer scientist Wei Dai?"
  - "that one hundred-millionth of a bitcoin is called a *satoshi*, after Bitcoin's pseudonymous creator [Satoshi Nakamoto](wiki/Satoshi_Nakamoto/)?"
  - "that [Ethereum](wiki/Ethereum/)'s switch to [proof of stake](wiki/Proof_of_stake/) in 2022 cut its energy use by an estimated 99.95%?"
  - "that in 2024 a UK High Court judge ruled that Craig Wright is not [Satoshi Nakamoto](wiki/Satoshi_Nakamoto/)?"
  - "that the bitcoin block subsidy has been [cut in half](wiki/Bitcoin_halving/) four times, from 50 to 3.125 bitcoins per block?"
  - "that the term *[smart contract](wiki/Smart_contract/)* was coined by Nick Szabo in the 1990s, more than a decade before Bitcoin?"

