# ------------------------------------------------------------------
#  SplytWiki site settings
# ------------------------------------------------------------------
title: SplytWiki
tagline: The Free Crypto Encyclopedia
site_sub: From SplytWiki, the free crypto encyclopedia
description: >-
  SplytWiki is a free online encyclopedia about cryptocurrency, blockchain
  technology, decentralized finance and the people and ideas behind them.

# GitHub Pages address: https://<username>.github.io/SplytWiki
# GitHub account: splytproject
# If you later use a custom domain, set baseurl to "" and add a CNAME file.
url: "https://splytproject.github.io"
baseurl: "/SplytWiki"
lang: en

# Shown on the Contact page. Leave empty to hide.
contact_email: ""

license:
  name: Creative Commons Attribution-ShareAlike 4.0 License
  url: https://creativecommons.org/licenses/by-sa/4.0/

# ------------------------------------------------------------------
#  Build settings (no need to change these)
# ------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_backlink: "^"

collections:
  wiki:
    output: true
    permalink: /wiki/:path/

defaults:
  # Image shown when any page is shared on social media (1200x630).
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: wiki
    values:
      layout: article
      has_toc: true
      namespace: article
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # Translated articles: de/wiki/*.md and es/wiki/*.md
  # Each one needs "ref:" set to the English article's title.
  - scope:
      path: "de/wiki"
    values:
      layout: article
      has_toc: true
      namespace: article
      lang: de
      permalink: /de/wiki/:basename/
  - scope:
      path: "es/wiki"
    values:
      layout: article
      has_toc: true
      namespace: article
      lang: es
      permalink: /es/wiki/:basename/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  # Lets BIP pages answer at /wiki/BIP350/ and /wiki/bip-0350/ via redirect_from
  - jekyll-redirect-from

exclude:
  - readme.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache
  # Internal notes and docs: not published on the website
  - de/readme.md
  - es/readme.md
  - config
  - reports
  - research_notes
