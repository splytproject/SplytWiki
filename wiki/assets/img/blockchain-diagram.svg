<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Simplified structure of a blockchain</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#36c"/>
    </marker>
    <g id="txs" font-size="11" fill="#202122">
      <rect width="176" height="70" rx="3" fill="#fff" stroke="#c8ccd1"/>
      <text x="8" y="16" font-weight="bold" fill="#54595d">Transactions</text>
      <text x="8" y="34">Tx · Alice → Bob</text>
      <text x="8" y="49">Tx · Carol → Dan</text>
      <text x="8" y="64">…</text>
    </g>
  </defs>
  <rect width="720" height="330" fill="#fff"/>

  <!-- Block 100 -->
  <g transform="translate(20 30)">
    <rect width="200" height="240" rx="4" fill="#f8f9fa" stroke="#a2a9b1"/>
    <path d="M0 4a4 4 0 0 1 4-4h192a4 4 0 0 1 4 4v28H0z" fill="#cedff2"/>
    <text x="100" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#202122">Block 100</text>
    <g font-size="11" fill="#202122">
      <text x="12" y="54" fill="#54595d">Prev. hash</text><text x="188" y="54" text-anchor="end" font-family="Consolas, monospace">00000c7e…</text>
      <text x="12" y="76" fill="#54595d">Timestamp</text><text x="188" y="76" text-anchor="end">10:00:12</text>
      <text x="12" y="98" fill="#54595d">Nonce</text><text x="188" y="98" text-anchor="end">48,213,907</text>
      <text x="12" y="120" fill="#54595d">Merkle root</text><text x="188" y="120" text-anchor="end" font-family="Consolas, monospace">9f2b41…</text>
    </g>
    <use href="#txs" x="12" y="158"/>
  </g>
  <text x="120" y="296" text-anchor="middle" font-size="12" fill="#202122">Hash: <tspan font-family="Consolas, monospace" font-weight="bold">0000a3f9…</tspan></text>

  <!-- Block 101 -->
  <g transform="translate(260 30)">
    <rect width="200" height="240" rx="4" fill="#f8f9fa" stroke="#a2a9b1"/>
    <path d="M0 4a4 4 0 0 1 4-4h192a4 4 0 0 1 4 4v28H0z" fill="#cedff2"/>
    <text x="100" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#202122">Block 101</text>
    <g font-size="11" fill="#202122">
      <rect x="6" y="41" width="188" height="19" rx="2" fill="#eaf3ff" stroke="#36c" stroke-width=".8"/>
      <text x="12" y="54" fill="#54595d">Prev. hash</text><text x="188" y="54" text-anchor="end" font-family="Consolas, monospace" font-weight="bold">0000a3f9…</text>
      <text x="12" y="76" fill="#54595d">Timestamp</text><text x="188" y="76" text-anchor="end">10:09:47</text>
      <text x="12" y="98" fill="#54595d">Nonce</text><text x="188" y="98" text-anchor="end">2,950,114</text>
      <text x="12" y="120" fill="#54595d">Merkle root</text><text x="188" y="120" text-anchor="end" font-family="Consolas, monospace">3c81d0…</text>
    </g>
    <use href="#txs" x="12" y="158"/>
  </g>
  <text x="360" y="296" text-anchor="middle" font-size="12" fill="#202122">Hash: <tspan font-family="Consolas, monospace" font-weight="bold">00007b12…</tspan></text>

  <!-- Block 102 -->
  <g transform="translate(500 30)">
    <rect width="200" height="240" rx="4" fill="#f8f9fa" stroke="#a2a9b1"/>
    <path d="M0 4a4 4 0 0 1 4-4h192a4 4 0 0 1 4 4v28H0z" fill="#cedff2"/>
    <text x="100" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#202122">Block 102</text>
    <g font-size="11" fill="#202122">
      <rect x="6" y="41" width="188" height="19" rx="2" fill="#eaf3ff" stroke="#36c" stroke-width=".8"/>
      <text x="12" y="54" fill="#54595d">Prev. hash</text><text x="188" y="54" text-anchor="end" font-family="Consolas, monospace" font-weight="bold">00007b12…</text>
      <text x="12" y="76" fill="#54595d">Timestamp</text><text x="188" y="76" text-anchor="end">10:21:05</text>
      <text x="12" y="98" fill="#54595d">Nonce</text><text x="188" y="98" text-anchor="end">731,560,228</text>
      <text x="12" y="120" fill="#54595d">Merkle root</text><text x="188" y="120" text-anchor="end" font-family="Consolas, monospace">e4a907…</text>
    </g>
    <use href="#txs" x="12" y="158"/>
  </g>
  <text x="600" y="296" text-anchor="middle" font-size="12" fill="#202122">Hash: <tspan font-family="Consolas, monospace" font-weight="bold">0000d55e…</tspan></text>

  <!-- links: each block points back to the one before it -->
  <line x1="265" y1="80" x2="224" y2="80" stroke="#36c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="80" x2="464" y2="80" stroke="#36c" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="320" text-anchor="middle" font-size="11.5" fill="#54595d">Each block records the hash of the previous block, linking them into a chain.</text>
</svg>
