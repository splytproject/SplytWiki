---
layout: default
---
<header class="mw-body-header vector-page-titlebar">
  <h1 id="firstHeading" class="firstHeading">{{ page.display_title | default: page.title }}</h1>
</header>
<div class="vector-page-toolbar">
  <ul class="vector-tabs">
    <li class="selected"><a href="{{ page.url | relative_url }}">{{ page.tab | default: 'Project page' }}</a></li>
  </ul>
  {%- unless page.tab == 'Special page' %}
  <ul class="vector-tabs vector-tabs-right">
    <li class="selected"><a href="{{ page.url | relative_url }}">Read</a></li>
  </ul>
  {%- endunless %}
</div>
<div id="bodyContent" class="vector-body">
  {%- unless page.tab == 'Special page' or page.is_main %}
  <div id="siteSub">{{ site.site_sub }}</div>
  {%- endunless %}
  <div class="mw-parser-output">
{{ content }}
  </div>
</div>
